name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run application check
        run: python -m py_compile app.py

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/nasarul10/devops-demo:${{ github.sha }} \
            -t ghcr.io/nasarul10/devops-demo:latest \
            .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/nasarul10/devops-demo:${{ github.sha }}
          docker push ghcr.io/nasarul10/devops-demo:latest

      - name: Deploy to EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ghcr.io/nasarul10/devops-demo:${{ github.sha }}

            docker stop devops-demo-container || true
            docker rm devops-demo-container || true

            docker run -d \
              --name devops-demo-container \
              -p 5000:5000 \
              ghcr.io/nasarul10/devops-demo:${{ github.sha }}

            for i in {1..10}; do
              if curl -fsS http://localhost:5000/health; then
                echo "Application is healthy"
                exit 0
              fi

              echo "Application not ready yet. Retrying..."
              sleep 2
            done

            echo "Application failed health check"
            exit 1